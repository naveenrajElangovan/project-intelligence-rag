repos:
  - repo: local
    hooks:
      - id: ruff-lint-ratchet
        name: Ruff lint ratchet
        entry: make lint
        language: system
        pass_filenames: false
      - id: ruff-format-ratchet
        name: Ruff format ratchet
        entry: make format-check
        language: system
        pass_filenames: false
      - id: mypy-ratchet
        name: mypy strict modules and repository ratchet
        entry: make type-check
        language: system
        pass_filenames: false
      - id: import-boundaries
        name: Import architecture contracts
        entry: make imports
        language: system
        pass_filenames: false
      - id: tests-and-coverage
        name: Tests and coverage gate
        entry: make test
        language: system
        pass_filenames: false
